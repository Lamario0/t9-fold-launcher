name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk t9-fold-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: t9-fold-launcher-${{ github.run_number }}
          path: t9-fold-launcher.apk

      # A release per build, so the phone can always grab the newest APK from the Releases page.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Commit ${{ github.sha }}: ${{ github.event.head_commit.message }}"
          files: t9-fold-launcher.apk
          make_latest: true
